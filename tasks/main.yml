- name: Creating an override directory for the override
  ansible.builtin.file:
    path: /etc/systemd/system/{{ systemd_override_sevice }}.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Setting override file for {{ systemd_override_sevice }}
  ansible.builtin.copy:
    content: "{{ systemd_override_content }}"
    dest: /etc/systemd/system/{{ systemd_override_sevice }}.d/override.conf
    owner: root
    group: root
    mode: '0644'
  # We restart the service is something changed to ensure the override is active
  notify: Restart the {{ systemd_override_sevice }} service
